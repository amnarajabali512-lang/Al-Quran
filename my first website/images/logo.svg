<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07271e"/>
      <stop offset="60%" stop-color="#0b3d2e"/>
      <stop offset="100%" stop-color="#145a44"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fdf0b5"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Circle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)"/>
  
  <!-- Inner Delicate Gold Octagram / Arch -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Quran Rehal Stand (Wooden Base) -->
  <path d="M170 370 L256 310 L342 370 M256 310 L256 410" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M140 400 L210 350 M372 400 L302 350" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>

  <!-- Open Holy Quran Pages -->
  <path d="M256 280 C220 220 150 215 100 230 C90 233 80 242 80 254 L80 340 C140 320 215 330 256 360 C297 330 372 320 432 340 L432 254 C432 242 422 233 412 230 C362 215 292 220 256 280 Z" 
        fill="#fdfbf7" stroke="url(#goldGrad)" stroke-width="10" stroke-linejoin="round"/>
        
  <!-- Book Spine Division -->
  <path d="M256 280 L256 360" stroke="#0b3d2e" stroke-width="6"/>

  <!-- Quranic Verses Golden Lines representation -->
  <path d="M120 265 C160 255 200 260 230 280" stroke="#0b3d2e" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M115 288 C155 278 195 283 230 300" stroke="#0b3d2e" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M115 311 C155 301 195 306 230 323" stroke="#0b3d2e" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

  <path d="M392 265 C352 255 312 260 282 280" stroke="#0b3d2e" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M397 288 C357 278 317 283 282 300" stroke="#0b3d2e" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M397 311 C357 301 317 306 282 323" stroke="#0b3d2e" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

  <!-- Golden Crescent and 8-point Star on Top -->
  <path d="M256 90 C220 90 190 120 190 156 C190 192 220 222 256 222 C242 210 234 192 234 172 C234 140 258 112 286 106 C276 96 266 90 256 90 Z" fill="url(#goldGrad)"/>
  
  <!-- 8-Point Star in Crescent -->
  <polygon points="280,140 285,150 295,150 287,157 290,167 280,161 270,167 273,157 265,150 275,150" fill="url(#goldGrad)"/>
  
  <!-- Light Rays / Noor Beams -->
  <line x1="256" y1="52" x2="256" y2="72" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <line x1="180" y1="84" x2="194" y2="98" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <line x1="332" y1="84" x2="318" y2="98" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
</svg>
